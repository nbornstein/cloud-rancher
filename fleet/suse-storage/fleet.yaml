# This is the plain, publicly-pullable "longhorn" chart from Rancher's own
# chart repo (no auth needed - its images are all public on Docker Hub under
# rancher/mirrored-longhornio-*), not SUSE's Application Collection OCI chart
# (oci://dp.apps.rancher.io/charts/suse-storage), which requires registry
# credentials for both the chart pull and the container images it deploys -
# wiring that through Fleet would mean handing those same credentials to the
# gpu-operator and ai-factory bundles' public OCI registries too, which
# reject (401, not anonymous fallback) any mismatched credentials.
defaultNamespace: longhorn-system

helm:
  repo: https://charts.rancher.io
  chart: longhorn
  version: "110.1.0+up1.12.1"
  releaseName: longhorn
  values:
    persistence:
      defaultClass: true
      defaultDataPath: /var/lib/longhorn

# Fleet names each Bundle <gitrepo-name>-<path, slashes replaced with
# dashes> - since this bundle's GitRepo is named "ai-factory" and this
# bundle's own path is "fleet/suse-storage-crd", dependsOn has to reference
# the resulting full bundle name (confirmed live via `kubectl get bundles -n
# fleet-default`), not the bare path basename.
dependsOn:
  - name: ai-factory-fleet-suse-storage-crd

targetCustomizations:
  - name: ai-factory-clusters
    clusterSelector:
      matchLabels:
        ai-factory: "true"
